<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM CRUD</title>
  </head>
  <body>
    <!-- DOM 조회-->
    <div>
      <h1>DOM 조회</h1>
      <p class="job">전사</p>
      <p class="job" id="healer">마법사</p>
      <p>모험가</p>
    </div>
    <script>
      const p1 = document.querySelector("p");
      console.log(p1);
      const p2 = document.querySelectorAll("p");
      console.log(...p2);
      const p3 = document.querySelector("#healer");
      console.log(p3);
      const p4 = document.querySelector(".job");
      console.log(...p4);
    </script>
  </body>
</html>
