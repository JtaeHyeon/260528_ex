<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Type</title>
  </head>
  <body>
    <script>
      const asy = async() => {}
      await asy();
      //SyntaxError:await is only valid on async functions and th top level bodies of modules
      //모든 요소 로딩(렌더링)이 중요하다면 load
      document.addEventListener("DOMContentLoaded", () => {
        //비동기를 처리하기 위한 감싸는 main, entry 진입점.
        console.log("DOM loading.,.");
        const btn = document.querySelector("#btn");
        console.log(btn);
      });
    </script>
    <button id="btn">click</button>
    <script>
      const btn = document.querySelector("#btn");
      console.log(btn);
    </script>
    <!-- input type -->
    <input type="text" id="i1" />
    <script>
      const i1 = document.querySelector("#i1");
      i1.addEventListener("input", (event) => {
        // console.log("입력중");
        console.log(event.target.value);
      });
      i1.addEventListener("change", (event) => {
        console.log("something change");
        console.log(event.target.value); //입력을 마치고 포커스가 풀려야함.
      });
    </script>
  </body>
</html>
