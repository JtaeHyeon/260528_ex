<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모 앱에 온 것 환영합니다</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
      "
    >
      <h1>메모 앱에 온 것 환영합니다</h1>
      <br />
      <a href="memo.html">
        <button style="padding: 12px">메모하러 가기1</button>
      </a>
      <!-- 2. js 지금 탭에서 이동하기 -->
      <button id="btn2" style="padding: 12px">메모하러 가기2</button>
      <!-- 3. js  -->
      <button id="btn3" style="padding: 12px">메모하러 가기3</button>
      <script>
        const btn2 = document.querySelector("#btn2");
        btn2.addEventListener("click", useLocationHref);
        function useLocationHref() {
          location.href = "memo.html";
        }
        // 지금 경로 127.0.0.1:5000/docs/{}
        //{ ... }를 교체
        // url 입력하면 거기로 이동
        const btn3 = document.querySelector("#btn3");
        btn3.addEventListener("click", useWindowOpen);
        function useWindowOpen() {
          window.open("memo.html");
        }

        //일반적으로는 2번 쓰고, js 안쓰면 1번 써도 된다.
      </script>
    </div>
  </body>
</html>
